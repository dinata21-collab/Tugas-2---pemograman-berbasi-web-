<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tracking DO - SITTA UT</title>
    <script src="https://cdn.jsdelivr.net/npm/vue@2/dist/vue.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen">
    <div id="app" class="max-w-4xl mx-auto px-4 py-8">
        <nav class="mb-6 flex justify-between items-center">
            <a href="index.html" class="text-blue-600 hover:underline font-medium">&larr; Kembali ke Beranda</a>
            <span class="text-xs bg-purple-100 text-purple-800 px-3 py-1 rounded-full font-semibold">Modul 2: Tracking Delivery Order (DO)</span>
        </nav>

        <header class="bg-white rounded-xl shadow p-6 mb-6">
            <h1 class="text-2xl font-bold text-slate-800">Tracking Pengiriman Dokumen & Bahan Ajar</h1>
            <p class="text-slate-500 text-sm">Pantau status pengiriman paket bahan ajar ke berbagai wilayah UPBJJ-UT.</p>
        </header>

        <div class="bg-white rounded-xl shadow p-6 mb-6 flex flex-col sm:flex-row gap-4 items-center justify-between">
            <input type="text" v-model="searchDO" placeholder="Cari Nomor DO atau Nama Penerima..." 
                   class="w-full sm:w-1/2 px-4 py-2 border rounded-lg text-sm">
            <div class="flex gap-2 w-full sm:w-auto">
                <button @click="filterStatus = ''" :class="{'bg-purple-600 text-white': filterStatus === '', 'bg-slate-100 text-slate-700': filterStatus !== ''}" class="px-4 py-2 rounded-lg text-xs font-semibold">Semua</button>
                <button @click="filterStatus = 'Dalam Perjalanan'" :class="{'bg-purple-600 text-white': filterStatus === 'Dalam Perjalanan', 'bg-slate-100 text-slate-700': filterStatus !== 'Dalam Perjalanan'}" class="px-4 py-2 rounded-lg text-xs font-semibold">Dalam Perjalanan</button>
                <button @click="filterStatus = 'Selesai'" :class="{'bg-purple-600 text-white': filterStatus === 'Selesai', 'bg-slate-100 text-slate-700': filterStatus !== 'Selesai'}" class="px-4 py-2 rounded-lg text-xs font-semibold">Selesai</button>
            </div>
        </div>

        <div class="space-y-4 mb-8">
            <div v-for="item in filteredDOList" :key="item.noDO" class="bg-white rounded-xl shadow p-6 border-l-4"
                 :class="{'border-blue-500': item.status === 'Dalam Perjalanan', 'border-green-500': item.status === 'Selesai', 'border-amber-500': item.status === 'Menunggu Konfirmasi'}">
                <div class="flex justify-between items-start">
                    <div>
                        <span class="text-xs font-mono font-bold text-purple-600" v-text="item.noDO"></span>
                        <h3 class="text-lg font-bold text-slate-800 mt-1" v-text="item.penerima"></h3>
                        <p class="text-sm text-slate-500" v-text="item.upbjj"></p>
                    </div>
                    <div>
                        <span v-if="item.status === 'Selesai'" class="bg-green-100 text-green-800 text-xs px-3 py-1 rounded-full font-bold">Selesai</span>
                        <span v-else-if="item.status === 'Dalam Perjalanan'" class="bg-blue-100 text-blue-800 text-xs px-3 py-1 rounded-full font-bold">Dalam Perjalanan</span>
                        <span v-else class="bg-amber-100 text-amber-800 text-xs px-3 py-1 rounded-full font-bold">Menunggu Konfirmasi</span>
                    </div>
                </div>
            </div>
        </div>

        <div class="bg-white rounded-xl shadow p-6">
            <h2 class="text-lg font-bold text-slate-800 mb-4">Input Data Pengiriman DO Baru</h2>
            <form @submit.prevent="tambahDO" class="grid sm:grid-cols-2 gap-4">
                <input type="text" v-model="formDO.noDO" placeholder="No DO" required class="px-3 py-2 border rounded-lg text-sm">
                <input type="text" v-model="formDO.upbjj" placeholder="UPBJJ Tujuan" required class="px-3 py-2 border rounded-lg text-sm">
                <input type="text" v-model="formDO.penerima" placeholder="Nama Penerima" required class="px-3 py-2 border rounded-lg text-sm">
                <input type="text" v-model="formDO.kurir" placeholder="Ekspedisi / Kurir" required class="px-3 py-2 border rounded-lg text-sm">
                <select v-model="formDO.status" class="px-3 py-2 border rounded-lg text-sm sm:col-span-2">
                    <option value="Menunggu Konfirmasi">Menunggu Konfirmasi</option>
                    <option value="Dalam Perjalanan">Dalam Perjalanan</option>
                    <option value="Selesai">Selesai</option>
                </select>
                <div class="sm:col-span-2 flex justify-end">
                    <button type="submit" class="bg-purple-600 hover:bg-purple-700 text-white font-medium px-6 py-2 rounded-lg text-sm">Simpan DO</button>
                </div>
            </form>
            <p v-if="logWatcherStatus" class="mt-3 text-xs text-purple-600 font-medium" v-text="logWatcherStatus"></p>
        </div>
    </div>
    <script src="js/dataBahanAjar.js"></script>
    <script src="js/tracking-app.js"></script>
</body>
</html>
